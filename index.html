<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharkajolBD ERP | Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  min-height: 100vh;
  color: #123d50;
}

/* Background */
.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background:
    linear-gradient(120deg, rgba(0,80,120,.20),
    rgba(0,180,190,.12)),
    url("https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=2000&q=85")
    center/cover no-repeat;
  position: relative;
  overflow: hidden;
}

/* Liquid Glass Card */
.glass-card {
  width: 100%;
  max-width: 480px;
  padding: 32px;
  text-align: center;
  border-radius: 30px;
  background: rgba(255,255,255,.38);
  border: 1px solid rgba(255,255,255,.75);
  box-shadow:
    0 20px 60px rgba(0,40,70,.25),
    inset 0 1px 2px rgba(255,255,255,.8);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
}

.logo {
  width: 112px;
  height: 112px;
  object-fit: contain;
  border-radius: 50%;
  background: white;
  border: 4px solid rgba(255,255,255,.9);
  box-shadow: 0 8px 25px #003b4525;
  margin-bottom: 14px;
}

h1 {
  color: #075b28;
  font-size: 25px;
  line-height: 1.5;
  margin-bottom: 5px;
}

h2 {
  color: #0875c9;
  font-size: 25px;
  margin-bottom: 10px;
}

.tagline {
  color: #075c82;
  font-size: 15px;
  margin-bottom: 24px;
}

.field {
  position: relative;
  margin: 14px 0;
}

.field input {
  width: 100%;
  padding: 16px;
  border: 1px solid rgba(255,255,255,.95);
  border-radius: 17px;
  background: rgba(255,255,255,.62);
  color: #123d50;
  font-size: 16px;
  outline: none;
  box-shadow: inset 0 2px 8px #ffffff55;
}

.field input:focus {
  border-color: #00bcd4;
  box-shadow: 0 0 0 3px #00bcd433;
}

.login-btn {
  width: 100%;
  padding: 15px;
  margin-top: 8px;
  border: 0;
  border-radius: 16px;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(110deg,#04bce7,#00a89c,#078b91);
  box-shadow: 0 8px 22px #009cba55;
  transition: .25s;
}

.login-btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
}

.divider {
  margin: 23px 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: #125b73;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: #1686a2;
}

.panels {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
}

.panel {
  padding: 17px 8px;
  border-radius: 17px;
  background: rgba(255,255,255,.55);
  border: 1px solid #ffffffb0;
  color: #08638b;
  font-weight: bold;
}

.panel span {
  display: block;
  font-size: 25px;
  margin-bottom: 7px;
}

.error {
  display: none;
  color: #9c1725;
  background: #ffffffa8;
  border-radius: 10px;
  padding: 10px;
  margin-top: 12px;
}

.footer {
  margin-top: 22px;
  color: #164d60;
  font-size: 12px;
}

@media(max-width:500px) {
  .login-page { padding: 14px; }
  .glass-card { padding: 23px 18px; }
  h1 { font-size: 21px; }
  h2 { font-size: 23px; }
  .logo { width: 95px; height: 95px; }
}
</style>
</head>

<body>

<div class="login-page">
  <main class="glass-card">

    <!-- সংগঠনের লোগো -->
    <img
      class="logo"
      src="logo.png"
      alt="চর কাজল সমাজ কল্যাণ সংগঠনের লোগো"
    >

    <h1>চর কাজল সমাজ কল্যাণ সংগঠন</h1>
    <h2>CharkajolBD ERP</h2>

    <p class="tagline">“মানবতার সেবায়, ঐক্যের শক্তি”</p>

    <form id="loginForm">
      <div class="field">
        <input
          id="username"
          type="text"
          placeholder="ইউজারনেম / মোবাইল নম্বর"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <input
          id="password"
          type="password"
          placeholder="পাসওয়ার্ড"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="login-btn" type="submit">
        ⇥ লগইন করুন
      </button>

      <p id="error" class="error">
        ইউজার আইডি অথবা পাসওয়ার্ড সঠিক নয়।
      </p>
    </form>

    <div class="divider">অথবা</div>

    <div class="panels">
      <div class="panel">
        <span>🛡️</span>
        Admin Panel
      </div>

      <div class="panel">
        <span>👤</span>
        User Panel
      </div>

      <div class="panel">
        <span>👥</span>
        Committee List
      </div>

      <div class="panel">
        <span>➕</span>
        Member Add
      </div>
    </div>

    <p class="footer">
      CharkajolBD ERP · চর কাজল সমাজ কল্যাণ সংগঠন
    </p>

  </main>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (username === "admin" && password === "demo123") {
    document.getElementById("error").style.display = "none";

    // এটি শুধু ডেমো লগইন।
    // এখানে আপনার ERP ড্যাশবোর্ডের ঠিকানা বসাতে হবে।
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("error").style.display = "block";
  }
});
</script>

</body>
</html>
