<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharkajolBD ERP</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:"Noto Sans Bengali","Arial",sans-serif;
 background:#eef5fc;
 color:#183654
}
.topbar{
 height:68px;
 background:linear-gradient(110deg,#071e69,#078fe0);
 color:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:5
}
.brand{font-size:23px;font-weight:bold}
.top-right{font-size:14px}
.layout{display:flex;min-height:calc(100vh - 68px)}
.sidebar{
 width:250px;
 flex-shrink:0;
 background:linear-gradient(#102c46,#061c35);
 color:white;
 padding:15px 10px
}
.profile{
 text-align:center;
 padding:20px 5px;
 border-bottom:1px solid #34506b;
 margin-bottom:12px
}
.avatar{
 width:65px;height:65px;border-radius:50%;
 background:#e5f5ff;
 color:#087fc1;
 display:flex;align-items:center;justify-content:center;
 font-size:30px;margin:0 auto 10px;
 border:3px solid #35c4ff
}
.profile h3{margin:5px 0;font-size:20px}
.profile p{margin:5px 0;color:#bce9ff;font-size:14px}
.menu{
 display:block;width:100%;text-align:left;
 padding:15px 12px;margin:5px 0;
 color:white;background:transparent;border:0;
 border-radius:9px;font-size:16px;cursor:pointer
}
.menu:hover,.menu.active{background:linear-gradient(90deg,#0876ef,#08b8ed)}
.main{flex:1;min-width:0;padding:20px}
.welcome{
 background:linear-gradient(120deg,#0875ae,#23c0e5);
 color:white;text-align:center;
 padding:38px 15px;border-radius:14px;
 box-shadow:0 5px 15px #b5d4e8
}
.welcome h1{font-size:clamp(25px,4vw,38px);margin:10px 0}
.welcome p{font-size:16px}
.cards{
 display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
 gap:15px;margin:20px 0
}
.card{
 background:white;padding:22px;border-radius:12px;
 box-shadow:0 3px 12px #d9e7f2
}
.card .number{font-size:28px;font-weight:bold;color:#087bc5}
.card p{margin-bottom:0;color:#657e96}
.panel{
 background:white;border-radius:12px;padding:20px;
 box-shadow:0 3px 12px #d9e7f2;margin-bottom:20px
}
.panel h2{margin-top:0;color:#0875ae}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
input,select{
 padding:11px;border:1px solid #c7d9e9;
 border-radius:7px;font-size:15px;max-width:100%
}
input{flex:1;min-width:130px}
button{font-family:inherit}
.btn{
 border:0;border-radius:7px;padding:11px 15px;
 color:white;background:#087bed;cursor:pointer;font-size:14px
}
.btn:hover{filter:brightness(.92)}
.btn.green{background:#139b62}
.btn.red{background:#e53c4d}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{
 background:#086a99;color:white;padding:13px;
 text-align:left;white-space:nowrap
}
td{padding:12px;border-bottom:1px solid #e2edf6}
tr:hover td{background:#f5faff}
.badge{
 background:#d9f8e8;color:#07814b;
 padding:5px 10px;border-radius:20px;font-size:13px
}
.form-grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px
}
.form-grid label{display:block;font-size:14px}
.form-grid input,.form-grid select{width:100%;margin-top:6px}
.footer{text-align:center;color:#6b8195;padding:20px;font-size:13px}
.hidden{display:none!important}
@media(max-width:750px){
 .brand{font-size:17px}
 .topbar{padding:0 12px}
 .sidebar{width:68px;padding:10px 5px}
 .profile{padding:10px 0}
 .profile .avatar{width:45px;height:45px;font-size:23px}
 .profile h3,.profile p,.menu .label{display:none}
 .menu{text-align:center;padding:15px 0;font-size:20px}
 .main{padding:10px}
 .cards{grid-template-columns:1fr}
 .welcome{padding:25px 10px}
 .form-grid{grid-template-columns:1fr}
 .panel{padding:13px}
}
</style>
</head>

<body>

<header class="topbar">
 <div class="brand">🌐 CharkajolBD ERP</div>
 <div class="top-right">👤 শাকিল মাহমুদ [এডমিন]</div>
</header>

<div class="layout">

<aside class="sidebar">
 <div class
